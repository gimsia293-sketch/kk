```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>효찬에게</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:#ffe6ef;
  cursor:pointer;
}

/* 귀여운 배경 */
body:before,
body:after{
  content:"";
  position:fixed;
  border-radius:50%;
  pointer-events:none;
}

body:before{
  width:280px;
  height:280px;
  background:#ffd2e2;
  left:-100px;
  top:-100px;
}

body:after{
  width:350px;
  height:350px;
  background:#e8dcff;
  right:-140px;
  bottom:-140px;
}

/* 화면 */
#screen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* 처음 안내 */
#guide{
  position:absolute;
  top:12%;
  color:#b27b91;
  font-size:14px;
  font-weight:bold;
  animation:fade .8s ease;
}

/* 첫 하트 */
#heart{
  border:0;
  background:none;
  font-size:130px;
  cursor:pointer;
  animation:pop .9s ease;
  filter:drop-shadow(0 10px 10px rgba(180,80,120,.18));
}

#heart:hover{
  transform:scale(1.08);
}

/* 효찬 */
#name{
  display:none;
  position:absolute;
  font-size:clamp(80px,18vw,180px);
  font-weight:900;
  color:#ff6699;
  text-shadow:
    4px 4px 0 white,
    7px 7px 0 rgba(255,100,150,.15);
  letter-spacing:-8px;
}

/* 마지막 하트 */
#bigHeart{
  display:none;
  position:absolute;
  font-size:clamp(230px,50vw,520px);
  line-height:1;
  filter:drop-shadow(0 18px 18px rgba(180,70,120,.22));
}

/* 바보 */
#fool{
  display:none;
  position:absolute;
  color:white;
  font-size:clamp(50px,10vw,105px);
  font-weight:900;
  letter-spacing:-5px;
  text-shadow:3px 4px 0 rgba(170,60,110,.3);
}

/* 페이드 + 통통 */
@keyframes pop{
  0%{
    opacity:0;
    transform:scale(.2);
  }
  55%{
    opacity:1;
    transform:scale(1.2);
  }
  75%{
    transform:scale(.9);
  }
  90%{
    transform:scale(1.06);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes fade{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}

/* 모바일 */
@media(max-width:600px){
  #heart{
    font-size:100px;
  }

  #guide{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="screen">

  <div id="guide">♡ 눌러보세요 ♡</div>

  <button id="heart">❤️</button>

  <div id="name">효찬</div>

  <div id="bigHeart">❤️</div>

  <div id="fool">바보</div>

</div>


<script>

let step=0;

const screen=document.getElementById("screen");
const heart=document.getElementById("heart");
const guide=document.getElementById("guide");
const name=document.getElementById("name");
const bigHeart=document.getElementById("bigHeart");
const fool=document.getElementById("fool");


/* 하트 클릭 */
heart.onclick=function(e){

  e.stopPropagation();

  if(step!==0) return;

  step=1;

  heart.style.display="none";
  guide.style.display="none";

  name.style.display="block";
  name.style.animation="pop .9s ease";

};


/* 화면 클릭 */
screen.onclick=function(){

  if(step!==1) return;

  step=2;

  name.style.display="none";

  bigHeart.style.display="block";
  bigHeart.style.animation="pop .9s ease";

  setTimeout(function(){

    fool.style.display="block";
    fool.style.animation="pop .8s ease";

  },200);

};

</script>

</body>
</html>
```
